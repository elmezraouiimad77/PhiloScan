# PR verification & optional Firebase Hosting preview channel (free-tier safe)
name: PR Verification & Optional Hosting Preview

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Lint Firestore security rules
        run: npx eslint DRAFT_firestore.rules firestore.rules

      - name: Run unit & API tests
        run: npx tsx --test tests/canonicalSigning.test.ts tests/tokenAndPiiGuard.test.ts tests/apiRoutes.test.ts

      - name: Build production bundle
        run: npm run build

      - name: Deploy PR preview to Firebase Hosting (when secret configured)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_AE3CA3A5_D34F_42A5_A4A }}
          FIREBASE_PROJECT_ID: project-ae3ca3a5-d34f-42a5-a4a
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not configured; skipping PR preview channel deploy."
            exit 0
          fi

          SA_FILE="$(mktemp)"
          trap 'rm -f "$SA_FILE"' EXIT
          chmod 600 "$SA_FILE"
          printf '%s' "$FIREBASE_SA" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          CHANNEL_ID="pr-${PR_NUMBER}"
          npx --yes firebase-tools hosting:channel:deploy "$CHANNEL_ID" --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive --json
