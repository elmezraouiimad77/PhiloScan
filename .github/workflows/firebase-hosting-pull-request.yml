# Deploy preview channels to Firebase Hosting on Pull Requests
name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Install Firebase CLI (firebase-tools)
        run: npm install -g firebase-tools

      - name: Verify secret & deploy PR preview to Firebase Hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_AE3CA3A5_D34F_42A5_A4A }}
          FIREBASE_PROJECT_ID: project-ae3ca3a5-d34f-42a5-a4a
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret. Go to GitHub Repository -> Settings -> Secrets and variables -> Actions -> New repository secret, name it FIREBASE_SERVICE_ACCOUNT, and paste your Google Cloud / Firebase Service Account JSON key."
            exit 1
          fi

          node -e '
            const raw = process.env.FIREBASE_SA || "";
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (err) {
              console.error("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Re-copy the full JSON key file without extra formatting.");
              process.exit(1);
            }
            if (!parsed.client_email || !parsed.private_key) {
              console.error("::error::FIREBASE_SERVICE_ACCOUNT JSON is missing client_email or private_key.");
              process.exit(1);
            }
          '

          SA_FILE="$(mktemp)"
          trap 'rm -f "$SA_FILE"' EXIT
          chmod 600 "$SA_FILE"
          printf '%s' "$FIREBASE_SA" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          CHANNEL_ID="pr-${PR_NUMBER}"
          DEPLOY_JSON="$(firebase hosting:channel:deploy "$CHANNEL_ID" --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive --json)"
          echo "$DEPLOY_JSON"

          PREVIEW_URL="$(node -e '
            try {
              const data = JSON.parse(process.argv[1]);
              const result = data.result || {};
              const firstSite = Object.values(result)[0] || {};
              console.log(firstSite.url || "");
            } catch {
              console.log("");
            }
          ' "$DEPLOY_JSON")"

          {
            echo "### Firebase Hosting PR Preview Deployed"
            echo "- Channel: \`$CHANNEL_ID\` (expires in 7 days)"
            if [ -n "$PREVIEW_URL" ]; then
              echo "- Preview URL: $PREVIEW_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
