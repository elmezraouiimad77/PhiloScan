# Free CI build & optional manual Firebase Hosting deploy (primary runtime: Render Free + Firestore Enterprise)
name: Build & Optional Firebase Hosting Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  build_and_optional_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Deploy static assets to Firebase Hosting (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_AE3CA3A5_D34F_42A5_A4A }}
          FIREBASE_PROJECT_ID: project-ae3ca3a5-d34f-42a5-a4a
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set; skipping optional Firebase Hosting deploy (primary backend+SPA runs on Render Free)."
            exit 0
          fi

          node -e '
            const raw = process.env.FIREBASE_SA || "";
            const parsed = JSON.parse(raw);
            if (!parsed.client_email || !parsed.private_key) {
              console.error("::error::FIREBASE_SERVICE_ACCOUNT JSON is missing client_email or private_key.");
              process.exit(1);
            }
          '

          SA_FILE="$(mktemp)"
          trap 'rm -f "$SA_FILE"' EXIT
          chmod 600 "$SA_FILE"
          printf '%s' "$FIREBASE_SA" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          npx --yes firebase-tools deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
